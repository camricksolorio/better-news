name: Ingest feeds

on:
  schedule:
    # Cadence lives here — edit this cron expression to change it.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# After ingest, embed loops until nothing remains (scripts/ci/run-stage.sh), then /api/health
# fails the job if the pipeline is stale or stuck, so GitHub's failure notification fires.
# Clustering is paused (2026-11-09): to resume, add back a step running
# `scripts/ci/run-stage.sh cluster` (with `if: always()`, before the health check) and set
# CLUSTERING_PAUSED to false in lib/pipeline/health.ts.
jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Call ingest endpoint
        run: |
          curl -sfL -X GET "${APP_URL}/api/ingest" \
            -H "Authorization: Bearer ${CRON_SECRET}"
      - name: Embed new articles
        if: always()
        run: scripts/ci/run-stage.sh embed
      - name: Check pipeline health
        if: always()
        run: scripts/ci/health.sh
